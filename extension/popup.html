<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus Blocker</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 240px;
      background: #111318;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }
    p {
      margin: 0 0 8px;
      color: #d1d5db;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      color: #e5e7eb;
    }
    li {
      margin-bottom: 4px;
    }
    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="dot" aria-hidden="true"></span>
    <h1>Focus Blocker</h1>
  </div>
  <p>Status: <strong>Always On</strong></p>
  <ul>
    <li>YouTube Shorts (redirected &amp; hidden)</li>
    <li>TikTok (blocked)</li>
  </ul>
  <p class="note">No toggle by design.</p>
</body>
</html>
